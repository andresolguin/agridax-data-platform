[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agridax-local"
version = "1.1.0"
description = "Local executable AgriDax analytical data platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dbt-core==1.12.5",
  "dbt-postgres==1.11.0",
  "psycopg[binary]==3.3.6",
  "python-dotenv==1.2.2",
  "pathspec==1.0.4",
  "PyYAML==6.0.3",
]

[tool.setuptools.packages.find]
include = ["agridax*", "data_generator*"]

[project.scripts]
agridax-release = "agridax.pipeline:main"
agridax-preflight = "agridax.preflight:main"
agridax-acceptance = "agridax.acceptance:main"
agridax-inspect = "agridax.inspect_dbt:main"
