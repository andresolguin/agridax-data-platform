version: 2
sources:
- name: raw
  schema: raw
  description: 'Durable ingestion boundary for AgriDax source data. RAW preserves
    source delivery history and ingestion metadata so downstream dbt models can apply
    deterministic deduplication, incremental processing, reconciliation, and historical
    recovery.

    '
  tables:
  - name: farms
    description: Physical RAW deliveries. Grain is raw_record_id; logical keys/revisions
      are resolved downstream. Arrival freshness aggregates max ingested_at for the
      entire table.
    config:
      loaded_at_field: ingested_at
      freshness:
        warn_after:
          count: 24
          period: hour
        error_after:
          count: 36
          period: hour
    columns:
    - name: raw_record_id
      description: Identity primary key of one physical delivery; not business identity
        or commit-order checkpoint.
      data_type: BIGINT
      data_tests:
      - not_null
      - unique
    - name: farm_id
      description: Stable farm business identifier.
      data_tests:
      - not_null
      data_type: TEXT
    - name: farm_name
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TEXT
      data_tests:
      - not_null
    - name: country_code
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: CHAR(2)
      data_tests:
      - not_null
    - name: region
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TEXT
    - name: owner_type
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TEXT
    - name: created_at
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TIMESTAMPTZ
      data_tests:
      - not_null
    - name: updated_at
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TIMESTAMPTZ
      data_tests:
      - not_null
    - name: ingested_at
      description: Timestamp when the record entered the analytical platform.
      data_tests:
      - not_null
      data_type: TIMESTAMPTZ
    - name: source_batch_id
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TEXT
    - name: source_file_name
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TEXT
  - name: fields
    description: Physical RAW deliveries. Grain is raw_record_id; logical keys/revisions
      are resolved downstream. Arrival freshness aggregates max ingested_at for the
      entire table.
    config:
      loaded_at_field: ingested_at
      freshness:
        warn_after:
          count: 24
          period: hour
        error_after:
          count: 36
          period: hour
    columns:
    - name: raw_record_id
      description: Identity primary key of one physical delivery; not business identity
        or commit-order checkpoint.
      data_type: BIGINT
      data_tests:
      - not_null
      - unique
    - name: field_id
      description: Stable field business identifier.
      data_tests:
      - not_null
      data_type: TEXT
    - name: farm_id
      description: Parent farm business identifier.
      data_tests:
      - not_null
      data_type: TEXT
    - name: field_name
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TEXT
      data_tests:
      - not_null
    - name: area_hectares
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: NUMERIC(12,2)
      data_tests:
      - not_null
    - name: crop_type
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TEXT
    - name: soil_type
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TEXT
    - name: irrigation_type
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TEXT
    - name: status
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TEXT
      data_tests:
      - not_null
    - name: created_at
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TIMESTAMPTZ
      data_tests:
      - not_null
    - name: effective_from
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TIMESTAMPTZ
      data_tests:
      - not_null
    - name: updated_at
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TIMESTAMPTZ
      data_tests:
      - not_null
    - name: ingested_at
      description: Timestamp when the record entered the analytical platform.
      data_tests:
      - not_null
      data_type: TIMESTAMPTZ
    - name: source_batch_id
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TEXT
    - name: source_file_name
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TEXT
  - name: field_events
    description: Physical RAW deliveries. Grain is raw_record_id; logical keys/revisions
      are resolved downstream. Arrival freshness aggregates max ingested_at for the
      entire table.
    config:
      loaded_at_field: ingested_at
      freshness:
        warn_after:
          count: 15
          period: minute
        error_after:
          count: 60
          period: minute
    columns:
    - name: raw_record_id
      description: Identity primary key of one physical delivery; not business identity
        or commit-order checkpoint.
      data_type: BIGINT
      data_tests:
      - not_null
      - unique
    - name: event_id
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TEXT
      data_tests:
      - not_null
    - name: source_system
      description: Source system that produced the event.
      data_tests:
      - not_null
      data_type: TEXT
    - name: source_event_id
      description: Stable event identifier within the source system.
      data_tests:
      - not_null
      data_type: TEXT
    - name: field_id
      description: Field associated with the event.
      data_tests:
      - not_null
      data_type: TEXT
    - name: event_type
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TEXT
      data_tests:
      - not_null
    - name: event_timestamp
      description: Business timestamp when the agricultural event occurred.
      data_tests:
      - not_null
      data_type: TIMESTAMPTZ
    - name: quantity
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: NUMERIC(18,4)
    - name: unit
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TEXT
    - name: event_payload
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: JSONB
    - name: source_updated_at
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TIMESTAMPTZ
    - name: ingested_at
      description: Timestamp when the record entered the analytical platform.
      data_tests:
      - not_null
      data_type: TIMESTAMPTZ
    - name: source_batch_id
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TEXT
  - name: weather_observations
    description: Physical RAW deliveries. Grain is raw_record_id; logical keys/revisions
      are resolved downstream. Arrival freshness aggregates max ingested_at for the
      entire table.
    config:
      loaded_at_field: ingested_at
      freshness:
        warn_after:
          count: '{{ var(''weather_freshness_warn_minutes'', 90) }}'
          period: minute
        error_after:
          count: '{{ var(''weather_freshness_error_minutes'', 180) }}'
          period: minute
    columns:
    - name: raw_record_id
      description: Identity primary key of one physical delivery; not business identity
        or commit-order checkpoint.
      data_type: BIGINT
      data_tests:
      - not_null
      - unique
    - name: observation_id
      description: Source or platform observation identifier.
      data_tests:
      - not_null
      data_type: TEXT
    - name: field_id
      description: Field associated with the observation.
      data_tests:
      - not_null
      data_type: TEXT
    - name: observed_at
      description: Business timestamp of the environmental observation.
      data_tests:
      - not_null
      data_type: TIMESTAMPTZ
    - name: temperature_c
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: NUMERIC(6,2)
    - name: rainfall_mm
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: NUMERIC(10,2)
    - name: humidity_pct
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: NUMERIC(5,2)
    - name: wind_speed_kmh
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: NUMERIC(8,2)
    - name: source_system
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TEXT
      data_tests:
      - not_null
    - name: source_updated_at
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TIMESTAMPTZ
    - name: ingested_at
      description: Timestamp when the record entered the analytical platform.
      data_tests:
      - not_null
      data_type: TIMESTAMPTZ
    - name: source_batch_id
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TEXT
  - name: sustainability_practices
    description: Physical RAW deliveries. Grain is raw_record_id; logical keys/revisions
      are resolved downstream. Arrival freshness aggregates max ingested_at for the
      entire table.
    config:
      loaded_at_field: ingested_at
      freshness:
        warn_after:
          count: 24
          period: hour
        error_after:
          count: 36
          period: hour
    columns:
    - name: raw_record_id
      description: Identity primary key of one physical delivery; not business identity
        or commit-order checkpoint.
      data_type: BIGINT
      data_tests:
      - not_null
      - unique
    - name: practice_id
      description: Stable sustainability practice assignment identifier.
      data_tests:
      - not_null
      data_type: TEXT
    - name: field_id
      description: Field associated with the practice.
      data_tests:
      - not_null
      data_type: TEXT
    - name: practice_type
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TEXT
      data_tests:
      - not_null
    - name: status
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TEXT
      data_tests:
      - not_null
    - name: verified
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: BOOLEAN
      data_tests:
      - not_null
    - name: valid_from
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: DATE
      data_tests:
      - not_null
    - name: valid_to
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: DATE
    - name: updated_at
      description: Source timestamp for the latest delivered state.
      data_tests:
      - not_null
      data_type: TIMESTAMPTZ
    - name: ingested_at
      description: Timestamp when the record entered the analytical platform.
      data_tests:
      - not_null
      data_type: TIMESTAMPTZ
    - name: source_batch_id
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TEXT
    - name: source_file_name
      description: Physical source value or delivery metadata; see docs/raw_data_contracts.md.
      data_type: TEXT
